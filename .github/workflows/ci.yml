name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # oldest and newest supported Python; the package is pure Python
        python: ["3.10", "3.14"]
        rf: ["7.5"]
        include:
          # oldest supported Robot Framework
          - { os: ubuntu-latest, python: "3.10", rf: "7.0" }
    name: test (${{ matrix.os }}, py${{ matrix.python }}, rf${{ matrix.rf }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Robot Framework's acceptance test data of the same version, for the id conformance tests
      - uses: actions/checkout@v4
        with:
          repository: robotframework/robotframework
          ref: v${{ matrix.rf }}
          path: robotframework
          sparse-checkout: atest
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev] "robotframework==${{ matrix.rf }}.*"
      - run: pytest
        env:
          RF_ATEST_DIR: ${{ github.workspace }}/robotframework/atest/testdata
